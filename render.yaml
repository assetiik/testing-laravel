# Render deploy blueprint.
# Render has no native PHP runtime, so the service is built from the Dockerfile.
services:
  - type: web
    name: dev-landing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Dev Landing API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: ru
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single,api
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: PHP_CLI_SERVER_WORKERS
        value: 4
      - key: AI_ENABLED
        value: true
      - key: AI_PROVIDER
        value: groq
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Secrets — set these in the Render dashboard, not in this file.
      - key: AI_API_KEY
        sync: false
      - key: CONTACT_OWNER_EMAIL
        sync: false
      # Render blocks outbound SMTP, so production uses the Resend HTTP API.
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_TIMEOUT
        value: 10
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
